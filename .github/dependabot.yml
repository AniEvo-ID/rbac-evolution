# Weekly dependency updates, grouped so each week opens a few PRs instead of dozens.
# CI is the gate: a group only merges when build, typecheck, tests, package lint, databases, Bun and E2E pass.
version: 2
updates:
  - package-ecosystem: npm
    # pnpm workspace: the root lockfile covers every package, example, test suite and the docs.
    directories:
      - /
      - /packages/*
      - /examples/*
      - /tests/*
      - /docs
    schedule:
      interval: weekly
      day: monday
    # Keep each range as it is while the new version still satisfies it, so published
    # peerDependencies (e.g. `express: >=4`) are never narrowed by an update.
    versioning-strategy: increase-if-necessary
    # Wait a week after a release before proposing it, so a compromised or broken
    # version is usually caught and unpublished first.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Changesets v3 goes together with changesets/action v2 (see the github-actions entry below).
      # Both are migrated in one pull request, by hand, because the release workflow only runs on main.
      - dependency-name: '@changesets/cli'
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']
    ignore:
      # changesets/action v2 needs Changesets v3 and renames its inputs (`version` -> `version-script`,
      # the token moves from `GITHUB_TOKEN` to `github-token`). Merged as-is it would break the next
      # release, which CI on a pull request can't catch. Migrate it together with `@changesets/cli` 3.
      - dependency-name: changesets/action
        update-types: [version-update:semver-major]
