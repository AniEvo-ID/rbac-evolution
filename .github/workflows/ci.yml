name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history, so the API changeset check can diff against the pull request's base.
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      # publint + attw: every package's exports, types and formats resolve for its consumers.
      # The packed tarball is the same on every Node version, so check it once.
      - if: matrix.node == 22
        run: pnpm lint:packages
      # Public API snapshot (etc/*.api.md) must match the built .d.ts files. Run `pnpm api:snapshot` to update it.
      - if: matrix.node == 22
        run: pnpm api:check
      # A pull request that changes the public API must add a changeset. Not for the release PR.
      - if: matrix.node == 22 && github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/check-api-changeset.mjs "origin/$BASE_REF"
      # Bundle size of the client packages (react, vue, next/middleware), limits in .size-limit.json.
      - if: matrix.node == 22
        run: pnpm size

  # Runs every package's tests against real PostgreSQL and MySQL servers (the PG_URL / MYSQL_URL suites,
  # which are skipped when those variables are absent).
  databases:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rbac
          POSTGRES_PASSWORD: rbac
          POSTGRES_DB: rbac
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rbac -d rbac"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: rbac
          MYSQL_DATABASE: rbac
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -prbac --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          # Test-only container password (SQL Server requires a complex one).
          MSSQL_SA_PASSWORD: Rbac_Test_2026
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Rbac_Test_2026 -C -b -Q 'SELECT 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      PG_URL: postgresql://rbac:rbac@localhost:5432/rbac
      MYSQL_URL: mysql://root:rbac@127.0.0.1:3306/rbac
      MONGO_URL: mongodb://localhost:27017/rbac
      MSSQL_URL: mssql://sa:Rbac_Test_2026@localhost:1433/master
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Every package's tests against the real servers, with coverage. Fails when a suite fails or a
      # package's coverage drops below its floor in coverage-floor.json (raise floors, never lower them).
      - run: node scripts/test-report.mjs --out=coverage-report.json --floor=coverage-floor.json

  peers:
    # Oldest (and newest, where it is newer than the dev dependency) supported version of each framework
    # or ORM peer, from the support matrix in planning/02-compatibility-and-semver.md. The dev dependency
    # (the newest supported major) is already tested by the `ci` job. Each entry swaps that package's
    # dev dependency for the listed versions; the lockfile change stays inside this job.
    name: peers (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: express 4
            pkg: '@anievo-id/rbac-evolution-express'
            deps: express@4 @types/express@4
          - name: hono 4.0
            pkg: '@anievo-id/rbac-evolution-hono'
            deps: hono@4.0.0
          - name: nestjs 10
            pkg: '@anievo-id/rbac-evolution-nestjs'
            deps: '@nestjs/common@10 @nestjs/core@10 @nestjs/platform-express@10 @nestjs/testing@10 reflect-metadata@0.1.13'
          - name: nestjs 11
            pkg: '@anievo-id/rbac-evolution-nestjs'
            deps: '@nestjs/common@11 @nestjs/core@11 @nestjs/platform-express@11 @nestjs/testing@11'
          - name: next 14 + react 18
            pkg: '@anievo-id/rbac-evolution-next'
            deps: next@14 react@18 react-dom@18 @types/react@18
          - name: next 16
            pkg: '@anievo-id/rbac-evolution-next'
            deps: next@16
          - name: nuxt 3
            pkg: '@anievo-id/rbac-evolution-nuxt'
            deps: nuxt@3 @nuxt/schema@3
          - name: react 18
            pkg: '@anievo-id/rbac-evolution-react'
            deps: react@18 react-dom@18 @types/react@18 @types/react-dom@18
          - name: vue 3.3
            pkg: '@anievo-id/rbac-evolution-vue'
            deps: vue@3.3
          - name: prisma 5.12
            pkg: '@anievo-id/rbac-evolution-prisma'
            deps: '@prisma/client@5.12.0 prisma@5.12.0'
          - name: drizzle-orm 0.38
            pkg: '@anievo-id/rbac-evolution-drizzle'
            deps: drizzle-orm@0.38.0
          - name: drizzle-orm 0.45
            pkg: '@anievo-id/rbac-evolution-drizzle'
            deps: drizzle-orm@0.45
          - name: kysely 0.28.0
            pkg: '@anievo-id/rbac-evolution-kysely'
            deps: kysely@0.28.0
            # The package's own sources build (with .d.ts) on 0.28.0, but two test fixtures don't type-check
            # before 0.28.15: kysely's MysqlPool type rejects mysql2's Pool, and a select over a union of
            # table names isn't callable. Runtime tests still run.
            skip_typecheck: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Rewrites the lockfile in this job only; nothing is committed.
      - run: pnpm --filter "${{ matrix.pkg }}" add -D ${{ matrix.deps }}
      - run: pnpm --filter "${{ matrix.pkg }}" ls --depth 0
      - run: pnpm --filter "${{ matrix.pkg }}..." build
      - if: ${{ !matrix.skip_typecheck }}
        run: pnpm --filter "${{ matrix.pkg }}" typecheck
      - run: pnpm --filter "${{ matrix.pkg }}" test

  bun:
    # Runs the built packages under the Bun runtime: core + the shared adapter conformance
    # suite, Drizzle on bun:sqlite, Hono on Bun.serve, and the CLI via `bun`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=./packages/*
      - run: bun --version
      - run: pnpm --filter rbac-evolution-bun-tests test:bun

  e2e:
    # Playwright against the two example apps (fresh SQLite data, production builds) and the docs site.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=./packages/*
      - run: pnpm --filter rbac-evolution-e2e exec playwright install --with-deps chromium
      - run: pnpm --filter rbac-evolution-e2e prepare:apps
      - run: pnpm --filter rbac-evolution-e2e test:e2e
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-traces
          path: tests/e2e/test-results
          retention-days: 7
