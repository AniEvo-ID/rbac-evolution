name: Release check

# Daily guard that the repo, npm and GitHub agree on every package's version
# (see scripts/verify-release.mjs). A red run means something drifted, e.g. a
# manual npm publish or deprecation, a deleted tag or a missing GitHub Release.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node scripts/verify-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
