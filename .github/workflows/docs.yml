name: Docs

# Builds the VitePress site in docs/ and deploys it to GitHub Pages
# (https://creation.anievo.id/rbac-evolution/).
# Runs on every push to main (not only docs changes) so the Test report page always
# reflects the latest code: scripts/test-report.mjs runs every package's tests with
# coverage, against real databases, and writes docs/public/reports/unit.json; the Playwright
# E2E run writes docs/public/reports/e2e.json.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rbac
          POSTGRES_PASSWORD: rbac
          POSTGRES_DB: rbac
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rbac -d rbac"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: rbac
          MYSQL_DATABASE: rbac
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -prbac --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PG_URL: postgresql://rbac:rbac@localhost:5432/rbac
      MYSQL_URL: mysql://root:rbac@127.0.0.1:3306/rbac
      MONGO_URL: mongodb://localhost:27017/rbac
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # for "last updated" timestamps
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=./packages/*
      # A failing suite is published on the report page instead of blocking the docs deploy;
      # main is protected by the CI checks anyway.
      - name: Test report
        run: node scripts/test-report.mjs || echo "::warning::Some test suites failed, see the Test report page."
      # Waits for npm when this push is a release (the publish runs in parallel).
      - name: Release sync report
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY_RETRIES: 30
        run: node scripts/verify-release.mjs || echo "::warning::npm and GitHub are out of sync, see the Test report page."
      - name: E2E report
        run: |
          pnpm --filter rbac-evolution-e2e exec playwright install --with-deps chromium
          pnpm --filter rbac-evolution-e2e prepare:apps
          pnpm --filter rbac-evolution-e2e test:e2e || echo "::warning::Some E2E tests failed, see the Test report page."
      # Rebuild so the site ships the fresh reports in docs/public/reports.
      - run: pnpm --filter @anievo-id/rbac-evolution-docs build
      # The frozen 0.x docs, built from the last 0.x release tag into dist/0.x/ (docs/scripts/archive.mjs).
      - name: Archived 0.x docs
        run: node docs/scripts/archive.mjs
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
