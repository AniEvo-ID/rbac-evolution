name: Release

# On every push to main, changesets/action either:
#  - opens/updates a "Version Packages" PR when there are pending changesets, or
#  - publishes the bumped packages to npm (via npm Trusted Publishing / OIDC — no token),
#    creates git tags and GitHub Releases.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # required for npm Trusted Publishing (OIDC) and provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Token of the "rbac-evolution release bot" GitHub App (installed only on this repo).
      # Used instead of GITHUB_TOKEN so the bot can open the "version packages" PR
      # and so CI runs on that PR (events from GITHUB_TOKEN don't trigger workflows).
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Trusted Publishing needs npm >= 11.5.1 (Node 22 ships npm 10)
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - name: Create release PR or publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          title: "chore(release): version packages"
          commit: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          NPM_CONFIG_PROVENANCE: true

      # changesets/action creates one GitHub Release per package, and the last one created
      # becomes "Latest". Point "Latest" at the core package instead.
      - name: Mark the core release as Latest
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          version=$(node -p "require('./packages/core/package.json').version")
          gh release edit "@anievo-id/rbac-evolution@${version}" --latest
