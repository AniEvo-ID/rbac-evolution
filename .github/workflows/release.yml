name: Release

# On every push to main, changesets/action either:
#  - opens/updates a "Version Packages" PR when there are pending changesets, or
#  - publishes the bumped packages to npm (via npm Trusted Publishing / OIDC — no token),
#    creates git tags and GitHub Releases.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # required for npm Trusted Publishing (OIDC) and provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Token of the "rbac-evolution release bot" GitHub App (installed only on this repo).
      # Used instead of GITHUB_TOKEN so the bot can open the "version packages" PR
      # and so CI runs on that PR (events from GITHUB_TOKEN don't trigger workflows).
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          # The app's Client ID (Iv23…, in the app's settings page): `app-id` is deprecated. GitHub also accepts
          # the numeric App ID as the JWT issuer, so the older RELEASE_APP_ID variable keeps working until
          # RELEASE_APP_CLIENT_ID is set.
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID || vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      # Trusted Publishing needs npm >= 11.5.1 (Node 22 ships npm 10)
      # Pinned: this job can publish, so a new npm release must not run here unreviewed
      - run: npm install -g npm@11.21.1
      - run: pnpm install --frozen-lockfile
      - name: Create release PR or publish to npm
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          # v2 ignores the GITHUB_TOKEN env: the bot token must be passed here.
          github-token: ${{ steps.app-token.outputs.token }}
          version-script: pnpm version-packages
          # Must reach `changeset publish` with the action's CHANGESETS_OUTPUT env (the pnpm script inherits it):
          # the action reads that file to push the tags, create the GitHub Releases and set `published`.
          publish-script: pnpm release
          pr-title: "chore(release): version packages"
          commit-message: "chore(release): version packages"
          # Default (push-with-git-cli: false): the release commit and the tags are pushed through the GitHub API,
          # so the commit is signed by GitHub and attributed to the release bot. Tags are lightweight tags
          # on the published commit.
        env:
          NPM_CONFIG_PROVENANCE: true

      # changesets/action creates one GitHub Release per package, in parallel, so whichever is created
      # last becomes "Latest". Point "Latest" at the core package instead.
      - name: Mark the core release as Latest
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          version=$(node -p "require('./packages/core/package.json').version")
          # A prerelease (1.0.0-rc.0) can't be GitHub's "Latest"; it stays marked as a prerelease.
          case "$version" in
            *-*) echo "Prerelease $version: not marking it as Latest." ;;
            *) gh release edit "@anievo-id/rbac-evolution@${version}" --latest ;;
          esac

      # Fails the release (and notifies) if npm and GitHub disagree after publishing:
      # version on npm with provenance, npm `latest`, git tag and GitHub Release per package.
      - name: Verify npm and GitHub are in sync
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERIFY_RETRIES: 30
        run: node scripts/verify-release.mjs
