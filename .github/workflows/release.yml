name: Release

# On every push to main, changesets/action either:
#  - opens/updates a "Version Packages" PR when there are pending changesets, or
#  - publishes the bumped packages to npm (via npm Trusted Publishing / OIDC — no token),
#    creates git tags and GitHub Releases.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # required for npm Trusted Publishing (OIDC) and provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Trusted Publishing needs npm >= 11.5.1 (Node 22 ships npm 10)
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - name: Create release PR or publish to npm
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          title: "chore(release): version packages"
          commit: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
