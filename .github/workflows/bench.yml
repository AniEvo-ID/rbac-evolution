name: Benchmarks

# On demand only (Actions → Benchmarks → Run workflow): the engine on the memory adapter and on SQLite,
# can() cold and cached, syncRoles(), and reverse lookups on 100k role links (tests/bench).
# Shared runners are noisy, so compare runs of the same workflow, not absolute numbers.
on:
  workflow_dispatch:
    inputs:
      subjects:
        description: Subjects (one role link each) in the reverse-lookup data set
        default: '100000'
        required: false

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=./packages/*
      - name: Run benchmarks
        env:
          BENCH_SUBJECTS: ${{ inputs.subjects }}
        run: pnpm --filter rbac-evolution-bench bench --outputJson bench.json
      - name: Job summary
        run: |
          {
            echo "## Benchmarks ($BENCH_SUBJECTS subjects, commit ${GITHUB_SHA::7})"
            echo
            node tests/bench/summary.mjs tests/bench/bench.json
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          BENCH_SUBJECTS: ${{ inputs.subjects }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-results
          path: tests/bench/bench.json
          retention-days: 90
